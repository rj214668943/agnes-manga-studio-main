name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'server.js'
      - 'lib/**'
      - 'public/**'
      - 'tools/build-exe.mjs'
      - '.github/workflows/build-exe.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npm install postject  # 👈 新增这一行，手动安装 postject

      - name: Build EXE
        run: node tools/build-exe.mjs

      - name: Smoke test EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\Agnes漫剧工坊.exe"
          $stdout = Join-Path $env:RUNNER_TEMP "agnes-exe.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "agnes-exe.stderr.log"
          $env:NO_OPEN = "1"
          $p = Start-Process -FilePath $exe -ArgumentList @() -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:5178/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
              if ($p.HasExited) { break }
            }
            Write-Host "--- EXE stdout ---"
            if (Test-Path $stdout) { Get-Content $stdout -Raw }
            Write-Host "--- EXE stderr ---"
            if (Test-Path $stderr) { Get-Content $stderr -Raw }
            if (-not $ok) {
              if ($p.HasExited) { throw "EXE exited early with code $($p.ExitCode)" }
              throw "EXE started but /api/health did not become ready"
            }
            Write-Host "EXE smoke test passed"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Agnes-Manga-Studio-EXE
          path: dist/*.exe
          if-no-files-found: error
